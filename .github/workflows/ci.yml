name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly: finds release assets that were deleted or moved.
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  style:
    name: Style and README
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Tap this repository
        run: brew tap swissarmyhammer/tap "$GITHUB_WORKSPACE"

      # Formulae are generated by cargo-dist, so skip the cops it cannot satisfy
      # (no test block, desc starts with the name, long lines).
      - name: Style check
        run: brew style --except-cops FormulaAudit/Test,FormulaAuditStrict/TestPresent,FormulaAudit/Desc,Layout/LineLength Formula/*.rb

      - name: README lists every formula
        run: |
          status=0
          for f in Formula/*.rb; do
            name=$(basename "$f" .rb)
            if ! grep -q "\`$name\`" README.md; then
              echo "::error::README.md does not mention formula $name"
              status=1
            fi
          done
          exit $status

      - name: Find formulae
        id: list
        run: |
          echo "formulae=$(ls Formula/*.rb | xargs -n1 basename | sed 's/\.rb$//' | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
    outputs:
      formulae: ${{ steps.list.outputs.formulae }}

  links:
    name: Release URLs resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every url
        run: |
          status=0
          for url in $(grep -hoE 'url "https?://[^"]+"' Formula/*.rb Casks/*.rb | cut -d'"' -f2 | sort -u); do
            if curl -fsSIL --retry 3 -o /dev/null "$url"; then
              echo "ok   $url"
            else
              echo "::error::missing $url"
              status=1
            fi
          done
          exit $status

  install:
    name: Install ${{ matrix.formula }} (${{ matrix.os }})
    needs: style
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
        formula: ${{ fromJSON(needs.style.outputs.formulae) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Homebrew
        if: runner.os == 'Linux'
        uses: Homebrew/actions/setup-homebrew@master

      - name: Tap this repository
        run: brew tap swissarmyhammer/tap "$GITHUB_WORKSPACE"

      - name: Install
        run: brew install swissarmyhammer/tap/${{ matrix.formula }}

      # The formulae are generated by cargo-dist and have no test block,
      # so run each installed binary here instead.
      - name: Smoke test
        run: |
          bins=$(grep -oE 'bin\.install "[^"]+"' Formula/${{ matrix.formula }}.rb | cut -d'"' -f2 | sort -u)
          for b in $bins; do
            "$(brew --prefix)/bin/$b" --version
          done
